name: xhs-comment-console-external

services:
  ocr:
    image: comment-console-ocr:1.0.0
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ocr/Dockerfile
    restart: unless-stopped
    environment:
      BIND: 0.0.0.0
      PORT: "18063"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18063/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 90s
  app:
    image: comment-console:1.0.0
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: v1.0.0
    restart: unless-stopped
    depends_on:
      ocr:
        condition: service_healthy
        required: false
    environment:
      CONSOLE_DEMO: ${CONSOLE_DEMO:-false}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      XHS_PROXY: ${XHS_PROXY:-}
      COOKIES_PATH: /app/backend/data/cookies.json
      OCR_URL: http://ocr:18063
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_ALLOW_FAKE_IP: ${OCR_ALLOW_FAKE_IP:-false}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-18062}:18060"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ${MYSQL_CONFIG_FILE:-../backend/config/mysql.docker.json}
        target: /app/backend/config/mysql.json
        read_only: true
        bind:
          create_host_path: false
      - session_data:/app/backend/data
      - image_data:/app/backend/images
    shm_size: 1gb
    stop_grace_period: 90s

volumes:
  session_data:
  image_data:
